transport:
  host: 127.0.0.1
  port: 5000
  reconnect_seconds: 1.0

mappings:
  - name: cmd_vel
    direction: ros2_to_ros1
    ros2:
      topic: /cmd_vel
      type: geometry_msgs/msg/Twist
    ros1:
      topic: /cmd_vel
      type: geometry_msgs/Twist
    fields:
      - {from: linear.x, to: linear.x}
      - {from: linear.y, to: linear.y}
      - {from: linear.z, to: linear.z}
      - {from: angular.x, to: angular.x}
      - {from: angular.y, to: angular.y}
      - {from: angular.z, to: angular.z}

  # Example ROS1 -> ROS2:
  - name: odom
    direction: ros1_to_ros2
    ros1:
      topic: /robot/robotnik_base_control/odom
      type: nav_msgs/Odometry
    ros2:
      topic: /odom
      type: nav_msgs/msg/Odometry
    fields:
      - {from: header.frame_id, to: header.frame_id}
      - {from: child_frame_id, to: child_frame_id}
      - {from: pose.pose.position.x, to: pose.pose.position.x}
      - {from: pose.pose.position.y, to: pose.pose.position.y}
      - {from: pose.pose.position.z, to: pose.pose.position.z}
      - {from: pose.pose.orientation.x, to: pose.pose.orientation.x}
      - {from: pose.pose.orientation.y, to: pose.pose.orientation.y}
      - {from: pose.pose.orientation.z, to: pose.pose.orientation.z}
      - {from: pose.pose.orientation.w, to: pose.pose.orientation.w}
      - {from: pose.covariance, to: pose.covariance}

  - name: tf
    direction: ros1_to_ros2
    ros2:
      topic: /tf
      type: tf2_msgs/msg/TFMessage
    ros1:
      topic: /tf
      type: tf2_msgs/TFMessage
    fields:
      - from: transforms
        to: transforms
        list_of:
          ros1_type: geometry_msgs/TransformStamped
          ros2_type: geometry_msgs/msg/TransformStamped
          fields:
            - {ros1: header.stamp.secs,  ros2: header.stamp.sec}
            - {ros1: header.stamp.nsecs, ros2: header.stamp.nanosec}
            - {from: header.frame_id,      to: header.frame_id}
            - {from: child_frame_id,       to: child_frame_id}
            - {from: transform.translation.x, to: transform.translation.x}
            - {from: transform.translation.y, to: transform.translation.y}
            - {from: transform.translation.z, to: transform.translation.z}
            - {from: transform.rotation.x, to: transform.rotation.x}
            - {from: transform.rotation.y, to: transform.rotation.y}
            - {from: transform.rotation.z, to: transform.rotation.z}
            - {from: transform.rotation.w, to: transform.rotation.w}

  - name: scan
    direction: ros1_to_ros2
    ros1:
      topic: /scan
      type: sensor_msgs/LaserScan
    ros2:
      topic: /scan
      type: sensor_msgs/msg/LaserScan
    fields:
      - {ros1: header.stamp.secs,  ros2: header.stamp.sec}
      - {ros1: header.stamp.nsecs, ros2: header.stamp.nanosec}
      - {from: header.frame_id,   to: header.frame_id}
      - {from: angle_min,         to: angle_min}
      - {from: angle_max,         to: angle_max}
      - {from: angle_increment,   to: angle_increment}
      - {from: time_increment,    to: time_increment}
      - {from: scan_time,         to: scan_time}
      - {from: range_min,         to: range_min}
      - {from: range_max,         to: range_max}
      - {from: ranges,            to: ranges}
      - {from: intensities,       to: intensities}
